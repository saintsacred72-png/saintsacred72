
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Ускоренные часы (Сутки = 60 мин)</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #1e1e2e;
            color: #cdd6f4;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
        }
        #clock {
            font-size: 5rem;
            font-weight: bold;
            background: #313244;
            padding: 20px 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <div id="clock">00:00:00</div>

    <script>
        function updateFastClock() {
            const now = new Date();
            
            // Берем текущие минуты, секунды и миллисекунды реального часа
            const realMinutes = now.getMinutes();
            const realSeconds = now.getSeconds();
            const realMilliseconds = now.getMilliseconds();

            // Считаем, сколько всего реальных секунд прошло с начала текущего часа
            const totalRealSecondsInHour = (realMinutes * 60) + realSeconds + (realMilliseconds / 1000);

            // Умножаем на 24, так как 24 игровых часа проходят за 1 реальный
            const totalVirtualSeconds = totalRealSecondsInHour * 24;

            // Переводим виртуальные секунды в часы, минуты и секунды
            const vHours = Math.floor(totalVirtualSeconds / 3600) % 24;
            const vMinutes = Math.floor((totalVirtualSeconds % 3600) / 60);
            const vSeconds = Math.floor(totalVirtualSeconds % 60);

            // Форматируем с добавлением ведущих нулей (например, 09:05:01)
            const format = (num) => String(num).padStart(2, '0');
            
            document.getElementById('clock').textContent = 
                `${format(vHours)}:${format(vMinutes)}:${format(vSeconds)}`;
        }

        // Обновляем каждые ~41 миллисекунду (1000 мс / 24), чтобы виртуальные секунды шли плавно
        setInterval(updateFastClock, 1000 / 24);
        updateFastClock();
    </script>
</body>
</html>
